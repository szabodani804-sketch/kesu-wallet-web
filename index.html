<!doctype html>
<html lang="hu"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src https: data:; connect-src https:;">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>Kesu Wallet – Web</title>
<style>
:root{
  --bg:#07080c; --bg2:#0c0e14; --panel:#11141c; --panel2:#171b26; --line:#232838; --line2:#2d3448;
  --text:#eef1f7; --muted:#8d95a8; --faint:#5a6277;
  --acc:#8b6cff; --acc2:#5b8cff; --accSoft:color-mix(in srgb,var(--acc) 14%,transparent);
  --up:#22c55e; --upSoft:rgba(34,197,94,.13); --down:#f04452; --downSoft:rgba(240,68,82,.13);
  --warn:#f5b83d; --warnSoft:rgba(245,184,61,.13);
  --r:16px; --font:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--font);overflow:hidden;
  -webkit-font-smoothing:antialiased;user-select:none}
input,button{font:inherit;color:inherit}
input{user-select:text}
button:focus-visible,.act:focus-visible{outline:2px solid var(--acc);outline-offset:2px}button:focus:not(:focus-visible){outline:none}
button{cursor:pointer;border:0;background:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#232838;border-radius:10px;border:3px solid var(--bg)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--muted)}.faint{color:var(--faint)}

/* ---- elrendezés ---- */
#app{display:flex;height:100%}
.sidebar{width:232px;flex:none;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 26px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 8px 24px color-mix(in srgb,var(--acc) 35%,transparent)}
.brand b{font-size:16px;letter-spacing:.2px}.brand small{display:block;color:var(--faint);font-size:11.5px;margin-top:-2px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--muted);font-weight:600;text-align:left;transition:.15s}
.nav button:hover{background:var(--panel);color:var(--text)}
.nav button.on{background:var(--accSoft);color:var(--text)}
.nav button.on svg{color:var(--acc)}
.nav svg{width:19px;height:19px;flex:none}
.side-bottom{margin-top:auto;display:flex;flex-direction:column;gap:3px}
.addr-pill{margin:0 0 12px;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:.15s}
.addr-pill:hover{border-color:var(--line2)}
.addr-pill small{color:var(--faint);font-size:11px;font-weight:700;letter-spacing:.6px}
.addr-pill div{font-family:var(--mono);font-size:12.5px;margin-top:3px;display:flex;justify-content:space-between}
main{flex:1;overflow-y:auto;padding:0 0 40px;position:relative}
.page{display:none;max-width:1248px;margin:0 auto;padding:0 34px;animation:fade .25s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:16px}
.ph h1{font-size:24px;font-weight:700;letter-spacing:-.3px}
.ph p{color:var(--muted);font-size:13px;margin-top:2px}

/* ---- elemek ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.cap{font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--faint);text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:650;background:var(--panel2);border:1px solid var(--line);transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--line2);background:#1c2130}
.btn svg{width:17px;height:17px}
.btn.pri{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 78%,#000));border-color:transparent;color:#fff;box-shadow:0 6px 20px color-mix(in srgb,var(--acc) 25%,transparent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.buy{background:var(--up);border-color:transparent;color:#04130a}
.btn.buy:hover{filter:brightness(1.07)}
.btn.sell{background:var(--down);border-color:transparent;color:#fff}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:10px}
.btn.lg{padding:13px 20px;font-size:15px;border-radius:14px}
.btn:disabled{opacity:.45;pointer-events:none}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.icon-btn:hover{color:var(--text);border-color:var(--line2)}
.icon-btn svg{width:18px;height:18px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700}
.pill.up{background:var(--upSoft)}.pill.down{background:var(--downSoft)}.pill.flat{background:var(--panel2);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.chip b{color:var(--text);font-weight:650}
.field{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:0 12px;transition:.15s}
.field:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--accSoft)}
.field input{flex:1;background:none;border:0;outline:0;padding:12px 0;min-width:0}
.field .unit{color:var(--muted);font-weight:700;font-size:13px}
.field svg{width:17px;height:17px;color:var(--faint)}
.tabs{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.tabs button{padding:6px 12px;border-radius:9px;font-size:12.5px;font-weight:650;color:var(--muted)}
.tabs button.on{background:var(--panel2);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.tabs button:hover{color:var(--text)}
.av{width:38px;height:38px;border-radius:50%;flex:none;object-fit:cover;background:var(--panel2);display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;overflow:hidden}
.av.lg{width:58px;height:58px;font-size:20px}.av.sm{width:28px;height:28px;font-size:11px}
.err{color:var(--down);font-size:13px;min-height:18px}
.skel{background:linear-gradient(90deg,var(--panel2),#1d2231,var(--panel2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.empty{padding:34px;text-align:center;color:var(--muted)}

/* ---- kezdőlap ---- */
.hero{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:18px;margin-bottom:18px}
.hero .bal{background:radial-gradient(120% 120% at 0% 0%,color-mix(in srgb,var(--acc) 25%,transparent),transparent 55%),radial-gradient(90% 90% at 100% 100%,color-mix(in srgb,var(--acc2) 16%,transparent),transparent 60%),var(--panel)}
.total{font-size:40px;font-weight:750;letter-spacing:-1px;margin:8px 0 4px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px}
.act{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:12.5px;font-weight:650;transition:.15s}
.act:hover{background:rgba(255,255,255,.07);border-color:var(--line2)}
.act i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--accSoft);color:var(--acc)}
.act.g i{background:var(--upSoft);color:var(--up)}
.act svg{width:18px;height:18px}
.chart-card{display:flex;flex-direction:column}
.chart-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.chart-wrap{position:relative;flex:1;min-height:210px;margin-top:10px}
.chart-wrap canvas{position:absolute;inset:0;width:100%;height:100%}
.chart-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;padding:16px}
.live-badge{position:absolute;top:2px;left:4px;display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.6px;color:#ff6b78;pointer-events:none}
.live-badge i{width:8px;height:8px;border-radius:50%;background:#ff4757;box-shadow:0 0 0 0 rgba(255,71,87,.6);animation:pulse 1.6s infinite}
.live-badge span{color:var(--faint);font-weight:600;letter-spacing:0}
.ldot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff4757;margin-right:6px;vertical-align:middle;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,71,87,.55)}70%{box-shadow:0 0 0 8px rgba(255,71,87,0)}100%{box-shadow:0 0 0 0 rgba(255,71,87,0)}}
.list .row{display:grid;grid-template-columns:minmax(200px,1.6fr) 1fr 1fr 1fr;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;cursor:pointer;transition:.12s}
.list .row:hover{background:var(--panel2)}
.list .head{cursor:default;color:var(--faint);font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding-top:2px;padding-bottom:6px}
.list .head:hover{background:none}
.tk{display:flex;align-items:center;gap:12px;min-width:0}
.tk b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.r{text-align:right}

/* ---- piac ---- */
.mk-bar{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.mk-bar .field{flex:1;min-width:260px}
.mlist .row{grid-template-columns:34px minmax(200px,1.7fr) 1fr .8fr 1fr 1fr 1fr}
.rank{color:var(--faint);font-weight:700;font-size:12.5px}

/* ---- token oldal ---- */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;margin-bottom:16px}
.back:hover{color:var(--text)}.back svg{width:16px;height:16px}
.th{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.th h1{font-size:24px;font-weight:750;display:flex;align-items:center;gap:10px}
.th .sym{font-size:13px;color:var(--muted);font-weight:700;padding:3px 9px;border-radius:8px;background:var(--panel2)}
.th .price{font-size:30px;font-weight:750;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tgrid{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
.tgrid .chart-wrap{min-height:330px}
.rug{margin-top:18px}
.rug-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.rug ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.rug li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px}
.rug li i{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.badge{padding:4px 10px;border-radius:8px;font-size:11.5px;font-weight:800;letter-spacing:.5px}
.lv0{background:var(--upSoft);color:var(--up)}.lv1{background:var(--warnSoft);color:var(--warn)}.lv2{background:var(--downSoft);color:var(--down)}
.trade .tabs{display:flex;margin-bottom:16px}.trade .tabs button{flex:1;padding:9px}
.trade .tabs button.on.b{background:var(--upSoft);color:var(--up)}
.trade .tabs button.on.s{background:var(--downSoft);color:var(--down)}
.presets{display:flex;gap:6px;margin:10px 0 16px}
.presets button{flex:1;padding:7px 0;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:12.5px;font-weight:650;color:var(--muted)}
.presets button:hover{color:var(--text);border-color:var(--line2)}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:var(--muted)}
.kv b{color:var(--text);font-weight:650}
.links{display:flex;gap:8px;margin-left:auto}

/* ---- felső sáv, kereső ---- */
.topbar{position:sticky;top:0;z-index:20;display:flex;gap:14px;align-items:center;padding:14px 34px;background:rgba(7,8,12,.84);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);margin-bottom:26px}
.gsearch{position:relative;flex:1;max-width:640px}
.gres{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--panel);border:1px solid var(--line2);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.6);padding:8px;display:none;max-height:460px;overflow:auto}
.gres.on{display:block;animation:fade .15s}
.gres h6{font-size:11px;color:var(--faint);letter-spacing:.7px;text-transform:uppercase;padding:8px 10px 4px}
.gres .it{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;cursor:pointer}
.gres .it:hover,.gres .it.sel{background:var(--panel2)}
.gres .it .rt{margin-left:auto;text-align:right}
.gres .note{padding:14px;color:var(--muted);font-size:13px}
.me{display:flex;align-items:center;gap:9px;padding:5px 14px 5px 5px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:650;margin-left:auto}
.me:hover{border-color:var(--line2)}
/* ---- barátok ---- */
.invite{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:radial-gradient(100% 160% at 0% 0%,color-mix(in srgb,var(--acc) 22%,transparent),transparent 60%),var(--panel)}
.invite .code{font-family:var(--mono);font-size:13px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;word-break:break-all;user-select:text;flex:1;min-width:260px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:16px}
.fcard{cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:14px}
.fcard:hover{border-color:var(--line2);transform:translateY(-2px)}
.fcard .tot{font-size:22px;font-weight:750}
.stack-av{display:flex;align-items:center}.stack-av>*{margin-left:-9px;border:2px solid var(--panel)}.stack-av>*:first-child{margin-left:0}
.whead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.whead h1{font-size:24px;font-weight:750}
.wtot{font-size:36px;font-weight:750;letter-spacing:-.8px}
/* ---- modál, toast ---- */
.ov{position:fixed;inset:0;background:rgba(3,4,8,.66);backdrop-filter:blur(6px);display:none;place-items:center;z-index:50}
.ov.on{display:grid;animation:fade .2s}
.modal{width:min(480px,92vw);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:22px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal h2{font-size:19px;font-weight:750;margin-bottom:4px}
.modal .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.mrow{display:flex;gap:10px;margin-top:20px}.mrow .btn{flex:1}
.big-amt{font-size:30px;font-weight:750;letter-spacing:-.5px}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px}
.warnbox{background:var(--downSoft);color:#ff9aa3;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:600}
.okbox{background:var(--upSoft);color:#8ff0b3;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:600}
.addr-big{font-family:var(--mono);font-size:14px;word-break:break-all;line-height:1.6;user-select:text}
.steps{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px;margin:12px 0}
.steps b{color:var(--text)}
#toasts{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:10px;z-index:60}
.toast{min-width:280px;max-width:420px;padding:13px 16px;border-radius:14px;background:var(--panel2);border:1px solid var(--line2);box-shadow:0 14px 40px rgba(0,0,0,.5);font-size:13.5px;font-weight:600;animation:fade .2s;cursor:default}
.toast.ok{border-color:rgba(34,197,94,.45)}.toast.bad{border-color:rgba(240,68,82,.5)}
.toast a{color:var(--acc);cursor:pointer;text-decoration:underline}

/* ---- belépés ---- */
#gate{position:fixed;inset:0;display:none;place-items:center;background:radial-gradient(60% 60% at 50% 0%,color-mix(in srgb,var(--acc) 18%,transparent),transparent 70%),var(--bg);z-index:40}
#gate.on{display:grid}
.gcard{width:min(440px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.gcard .logo{width:52px;height:52px;font-size:24px;border-radius:16px;margin-bottom:18px}
.gcard h2{font-size:22px;font-weight:750}
.gcard p{color:var(--muted);font-size:13.5px;margin:6px 0 18px}
.gcard label{display:block;margin:12px 0 6px}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:6px}
@media (max-width:1100px){.hero{grid-template-columns:1fr}.tgrid{grid-template-columns:1fr}.mlist .row{grid-template-columns:28px minmax(180px,1.7fr) 1fr .8fr 1fr}.mlist .row>:nth-child(6),.mlist .row>:nth-child(7){display:none}}

/* ---- beállítások ---- */
.set-grid{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:start}
.set-nav{position:sticky;top:100px;display:flex;flex-direction:column;gap:2px}
.set-nav button{padding:10px 12px;border-radius:10px;text-align:left;color:var(--muted);font-weight:600}
.set-nav button:hover{color:var(--text);background:var(--panel)}
.set-sec{margin-bottom:18px;scroll-margin-top:100px}
.set-sec h3{font-size:16px;font-weight:700;margin-bottom:6px}
.set-row{display:grid;grid-template-columns:210px 1fr;gap:18px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}
.set-sec h3+.set-row{border-top:0}
.set-row .lbl b{display:block;font-weight:650}.set-row .lbl small{color:var(--faint);font-size:12px}
.set-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.set-ctl .field{flex:1;min-width:200px}
.swatch{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent;box-shadow:inset 0 0 0 3px var(--panel);transition:.15s}
.swatch:hover{transform:scale(1.08)}.swatch.on{border-color:var(--text)}
.av.xl{width:84px;height:84px;font-size:30px}
.switch{width:46px;height:26px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);position:relative;transition:.2s;flex:none}
.switch i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:.2s}
.switch.on{background:var(--acc);border-color:transparent}.switch.on i{left:23px;background:#fff}
.presets button.instant{color:#ffb3ba;border-color:rgba(240,68,82,.45);background:rgba(240,68,82,.08)}
.presets button.instant:hover{background:rgba(240,68,82,.18);color:#fff}
.hint{font-size:12px;color:var(--faint);margin-top:8px;line-height:1.5}
.langsw{display:flex;justify-content:center;margin-top:18px}
.empty a{color:var(--acc);cursor:pointer;font-weight:650}
.me img.av,.me .av{width:28px;height:28px;font-size:12px}
@media (max-width:1100px){.set-grid{grid-template-columns:1fr}.set-nav{display:none}.set-row{grid-template-columns:1fr}}

/* ================= TELEFON ================= */
.tabbar,.mlogo{display:none}
#rowBtc,#nav [data-p="btc"]{display:none !important}  /* a Bitcoin-tárca csak gépen */
@media (max-width: 760px){
  html,body{overflow:hidden}
  body{font-size:15px}
  input,select,textarea{font-size:16px !important}
  .sidebar{display:none}
  #app{flex-direction:column}
  main{padding:0 0 calc(86px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
  .page{padding:0 14px}
  .topbar{padding:calc(10px + env(safe-area-inset-top)) 14px 10px;gap:10px;margin-bottom:14px}
  .mlogo{display:grid;width:34px;height:34px;font-size:16px;border-radius:11px;flex:none}
  .gsearch{max-width:none}
  .gsearch .field input{padding:10px 0}
  .me{padding:4px;margin-left:0}
  .me #meName{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(12,14,20,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--faint);font-size:10.5px;font-weight:650}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button.on{color:var(--text)}.tabbar button.on svg{color:var(--acc)}
  .tabbar .tb-buy i{width:48px;height:48px;margin-top:-20px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 8px 22px color-mix(in srgb,var(--acc) 45%,transparent)}
  .tabbar .tb-buy svg{width:24px;height:24px}
  .ph{margin-bottom:14px}.ph h1{font-size:21px}.ph p{font-size:12.5px}
  .card{padding:16px;border-radius:18px}
  .hero{grid-template-columns:1fr;gap:12px;margin-bottom:12px}
  .total{font-size:34px}
  .actions{gap:6px;margin-top:16px}
  .act{padding:10px 2px;font-size:11.5px}
  .chart-wrap{min-height:220px}
  .tgrid .chart-wrap{min-height:260px}
  .chart-head{flex-wrap:wrap}
  .tabs button{padding:6px 10px}
  /* listák: kevesebb oszlop */
  .list .row{grid-template-columns:minmax(0,1fr) auto auto;padding:11px 8px;gap:10px}
  .list .row>:nth-child(3){display:none}
  .list .head{display:none}
  .mlist .row{grid-template-columns:minmax(0,1fr) auto auto}
  .mlist .row>:nth-child(1),.mlist .row>:nth-child(5),.mlist .row>:nth-child(6),.mlist .row>:nth-child(7){display:none}
  .mlist .row>:nth-child(3){display:block}
  .mk-bar .field{min-width:0;width:100%}
  .mk-bar .tabs{width:100%}.mk-bar .tabs button{flex:1}
  /* coin oldal: grafikon, alatta vétel/eladás, aztán biztonság */
  .th{gap:12px;flex-wrap:wrap}.th h1{font-size:19px}.th .price{font-size:24px}
  .av.lg{width:48px;height:48px}
  .links{margin-left:0;width:100%;flex-wrap:wrap}
  .chips{gap:6px}.chip{font-size:11.5px;padding:5px 9px}
  .tgrid{display:flex;flex-direction:column;gap:12px;align-items:stretch}
  .tgrid>*,.tgrid>div:first-child>*{width:auto;min-width:0}
  .tgrid>div:first-child{display:contents}
  .tgrid .chart-card{order:1}.tgrid .trade{order:2}.tgrid .rug{order:3;margin-top:0}
  /* barátok, tárca */
  .fgrid{grid-template-columns:1fr}
  .invite .code{min-width:0;width:100%}
  .whead h1{font-size:20px}.wtot{font-size:30px}
  .whead .links{width:100%}
  /* beállítások */
  .set-grid{grid-template-columns:1fr}.set-nav{display:none}
  .set-row{grid-template-columns:1fr;gap:10px}
  /* ablakok: alulról felcsúszó lap */
  .ov{align-items:end;place-items:end stretch}
  .ov.on{display:flex;align-items:flex-end}
  .modal{width:100%;max-width:none;max-height:92vh;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));animation:sheet .25s ease}
  .modal::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line2);margin:-8px auto 14px}
  .mrow{flex-direction:row}
  #toasts{left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));top:auto}
  .toast{min-width:0;max-width:none}
  #gate{padding:0 12px}.gcard{padding:24px 20px}
}
@keyframes sheet{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}

function drawChart(canvas, pts, msgEl, anim){

  const nx = (W - pad.l - pad.r) < 330 ? 2 : 3;   // keskeny grafikonon kevesebb időcímke, hogy ne csússzanak egymásra

  g.beginPath(); pts.forEach((p,i)=> i ? g.lineTo(x(i),y(p[1])) : g.moveTo(x(i),y(p[1])));
  g.lineTo(x(pts.length-1),H-pad.b); g.lineTo(x(0),H-pad.b); g.closePath(); g.fillStyle = grad; g.fill();
  g.beginPath(); pts.forEach((p,i)=> i ? g.lineTo(x(i),y(p[1])) : g.moveTo(x(i),y(p[1])));

}

  if (lv){ lv.mint = mint; S.lastLive = lv; candleTick(cs, lv); }
  canvas._cs = cs; canvas._pts = null; msgEl.style.display = "none"; setLive(canvas, true);
  // görgő: zoom (30 mp … 10 perc)
  canvas.onwheel = ev => { ev.preventDefault(); cs.win = Math.round(Math.min(600, Math.max(30, cs.win * (ev.deltaY > 0 ? 1.2 : 1/1.2)))); S.candleWin = cs.win; renderCandles(canvas); };
  canvas.onmousemove = ev => { const r = canvas.getBoundingClientRect(); cs.hover = ev.clientX - r.left; renderCandles(canvas); };
  canvas.onmouseleave = () => { cs.hover = null; renderCandles(canvas); };
  let busy = false;
  canvas._cpoll = setInterval(async () => {
    if (canvas._cs !== cs || !canvas.isConnected){ clearInterval(canvas._cpoll); return; }
    cs.now = Math.max(cs.now, Date.now()/1000 - (S.clockSkew || 0)); renderCandles(canvas);     // az idő akkor is halad, ha nincs új ár
    if (busy || !canvas.offsetParent || (Date.now() - (cs.lastPoll || 0)) < 4000) return;
    busy = true; cs.lastPoll = Date.now();
    try { const r = await call("trades", mint); if (canvas._cs === cs){ mergeTrades(cs, r.trades); renderCandles(canvas); } } catch(e){} finally { busy = false; }
  }, 1000);
  if (lv) S.clockSkew = Date.now()/1000 - lv.t;
  renderCandles(canvas);
  return true;
}
function buildCandles(cs){
  const t1 = Math.floor(cs.now), t0 = t1 - cs.win + 1;
  const pts = cs.trades.concat(cs.ticks).sort((a, b) => a.t - b.t);
  let i = 0, prev = null;
  while (i < pts.length && pts[i].t < t0) prev = pts[i++].p;
  const out = [];
  for (let s = t0; s <= t1; s++){
    let o = prev, h = prev, l = prev, c = prev, vb = 0, vs = 0, n = 0;
    while (i < pts.length && pts[i].t < s + 1){
      const p = pts[i++];
      if (o == null) o = h = l = p.p;
      h = Math.max(h, p.p); l = Math.min(l, p.p); c = p.p;
      if (!p.tick){ n++; if (p.side === "sell") vs += p.v; else vb += p.v; }
    }
    out.push(c == null ? null : {t: s, o, h, l, c, vb, vs, n});
    if (c != null) prev = c;
  }
  return out;
}
function renderCandles(canvas){
  const cs = canvas._cs; if (!cs) return;
  const wrap = canvas.parentElement, dpr = window.devicePixelRatio || 1, W = wrap.clientWidth, H = wrap.clientHeight;
  if (!W || !H) return;
  if (canvas.width !== W*dpr || canvas.height !== H*dpr){ canvas.width = W*dpr; canvas.height = H*dpr; }
  const g = canvas.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  const cd = buildCandles(cs), vis = cd.filter(Boolean);
  const msg = canvas.nextElementSibling;
  if (!vis.length){ msg.textContent = t("chart_nodata"); msg.style.display = "grid"; return; }
  msg.style.display = "none";
  const pad = {l: 6, r: 74, t: 64, b: 24}, volH = Math.round((H - pad.t - pad.b) * 0.16);
  const pH = H - pad.t - pad.b - volH - 6;
  let lo = Math.min(...vis.map(c => c.l)), hi = Math.max(...vis.map(c => c.h));
  if (hi === lo){ hi *= 1.004; lo *= 0.996; }
  const m = (hi - lo) * 0.18; hi += m; lo -= m;                          // kicsit kizoomolva: hely felül-alul
  const plotW = W - pad.l - pad.r, slot = plotW / cs.win, bw = Math.max(1, Math.min(14, slot * 0.62));
  const X = k => pad.l + slot * (k + 0.5), Y = v => pad.t + pH * (1 - (v - lo) / (hi - lo));
  const loc = LANG === "hu" ? "hu-HU" : "en-US", UP = "#22c55e", DN = "#f04452";
  // rács + árcímkék
  g.font = "11px Segoe UI, sans-serif"; g.lineWidth = 1;
  for (let k = 0; k <= 4; k++){ const v = lo + (hi - lo) * k / 4, yy = Math.round(Y(v)) + .5;
    g.strokeStyle = "rgba(255,255,255,.05)"; g.beginPath(); g.moveTo(pad.l, yy); g.lineTo(W - pad.r + 4, yy); g.stroke();
    g.fillStyle = "#5a6277"; g.fillText(fmtPrice(v), W - pad.r + 10, yy + 4); }
  // időcímkék
  const nx = plotW < 360 ? 2 : 4;
  for (let k = 0; k <= nx; k++){ const idx = Math.round((cd.length - 1) * k / nx), ts = cs.now - (cd.length - 1 - idx);
    g.textAlign = k === 0 ? "left" : k === nx ? "right" : "center"; g.fillStyle = "#5a6277";
    g.fillText(new Date(ts * 1000).toLocaleTimeString(loc, {hour: "2-digit", minute: "2-digit", second: "2-digit"}), k === 0 ? pad.l : k === nx ? W - pad.r : X(idx), H - 6); }
  g.textAlign = "left";
  // forgalom
  const vmax = Math.max(1e-9, ...vis.map(c => c.vb + c.vs)), vBase = pad.t + pH + 6 + volH;
  let dir = UP;
  cd.forEach((c, k) => { if (!c) return;
    dir = c.c > c.o ? UP : c.c < c.o ? DN : dir;
    const v = c.vb + c.vs; if (v > 0){ const hh = Math.max(1, volH * v / vmax); g.fillStyle = (c.vb >= c.vs ? UP : DN) + "66"; g.fillRect(X(k) - bw/2, vBase - hh, bw, hh); }
  });
  // gyertyák
  dir = UP;
  cd.forEach((c, k) => { if (!c) return;
    dir = c.c > c.o ? UP : c.c < c.o ? DN : dir;
    const x = X(k), yo = Y(c.o), yc = Y(c.c), yh = Y(c.h), yl = Y(c.l);
    g.strokeStyle = g.fillStyle = dir;
    if (yl - yh >= 1){ g.beginPath(); g.moveTo(Math.round(x) + .5, yh); g.lineTo(Math.round(x) + .5, yl); g.stroke(); }
    const top = Math.min(yo, yc), bh = Math.max(1.2, Math.abs(yc - yo));
    g.fillRect(x - bw/2, top - (bh === 1.2 ? .6 : 0), bw, bh);
  });
  // aktuális ár szaggatott vonallal + címke
  const last = vis[vis.length - 1], ly = Y(last.c), lc = last.c >= (vis[0].o) ? UP : DN;
  g.setLineDash([3, 3]); g.strokeStyle = lc + "aa"; g.beginPath(); g.moveTo(pad.l, ly); g.lineTo(W - pad.r + 4, ly); g.stroke(); g.setLineDash([]);
  g.fillStyle = lc; g.beginPath(); g.roundRect(W - pad.r + 4, ly - 10, pad.r - 6, 20, 5); g.fill();
  g.fillStyle = "#fff"; g.font = "600 11px Segoe UI, sans-serif"; g.fillText(fmtPrice(last.c), W - pad.r + 9, ly + 4);
  // egér: célkereszt + O/H/L/C
  let sel = last;
  if (cs.hover != null){ const k = Math.max(0, Math.min(cd.length - 1, Math.floor((cs.hover - pad.l) / slot)));
    if (cd[k]){ sel = cd[k]; const x = X(k); g.strokeStyle = "rgba(255,255,255,.22)"; g.setLineDash([4, 4]);
      g.beginPath(); g.moveTo(x, pad.t); g.lineTo(x, vBase); g.stroke(); g.setLineDash([]); } }
  const ch = sel.o ? (sel.c / sel.o - 1) * 100 : 0, sc = sel.c >= sel.o ? UP : DN;
  g.font = "600 11.5px Segoe UI, sans-serif"; let x = pad.l + 4; const yL = 34;
  const part = (lbl, val, col) => { g.fillStyle = "#8a93a8"; g.fillText(lbl, x, yL); x += g.measureText(lbl).width + 3; g.fillStyle = col; g.fillText(val, x, yL); x += g.measureText(val).width + 10; };
  part("", new Date(sel.t * 1000).toLocaleTimeString(loc, {hour: "2-digit", minute: "2-digit", second: "2-digit"}), "#cfd5e2");
  part("O", fmtPrice(sel.o), sc); part("H", fmtPrice(sel.h), sc); part("L", fmtPrice(sel.l), sc); part("C", fmtPrice(sel.c), sc);
  part("", (ch >= 0 ? "+" : "") + ch.toFixed(2) + "%", sc);
  if (sel.vb + sel.vs > 0) part("Vol", fmtUsd(sel.vb + sel.vs), "#cfd5e2");
  g.fillStyle = "#5a6277"; g.font = "11px Segoe UI, sans-serif"; g.fillText(`${cs.win}s · ${t("trades_n", {n: cs.trades.length})}`, pad.l + 4, yL + 17);
}

// =============== élő ár és grafikon (a legújabb tokenekhez) ===============
function setLive(canvas, on){
  canvas._live = on; let b = canvas.parentElement.querySelector(".live-badge");
  if (on && !b){ b = document.createElement("div"); b.className = "live-badge"; canvas.parentElement.appendChild(b); }
  if (b){ if (on) b.innerHTML = `<i></i>${esc(t("live"))} <span>${esc(t("live_note"))}</span>`; else b.remove(); }
}
const LIVE_WINDOW = 180;   // az élő grafikon az utolsó 3 percet mutatja, másodperces pontokkal
async function liveChart(mint, canvas, msgEl, seq, useMinutes){
  const [r, mins] = await Promise.all([
    (S.lastLive && S.lastLive.mint === mint && Date.now()/1000 - S.lastLive.t < 3) ? Promise.resolve(S.lastLive)
      : call("live", mint).then(x => (x.mint = mint, x)).catch(() => null),
    useMinutes ? getChart(mint, "1ó").catch(() => null) : Promise.resolve(null)]);
  if (canvas._seq !== seq) return true;
  if (!r) return false;
  const now = Math.floor(r.t);
  let pts = (mins || []).filter(p => p[0] >= now - LIVE_WINDOW - 60 && p[0] < now - 1).slice(-4);
  if (pts.length < 2){   // nincs percenkénti adat: becslés a DexScreener 5 perces változásából
    pts = []; if (r.m5 != null && !(r.age_min != null && r.age_min < 5)){ const v = r.price / (1 + r.m5/100); if (isFinite(v) && v > 0) pts.push([now - 300, v]); }
  }
  pts.push([now, r.price]);
  if (pts.length === 1) pts.unshift([now - 1, r.price]);
  canvas._window = LIVE_WINDOW; canvas._liveStart = now;
  canvas._pts = pts; setLive(canvas, true); trimLive(canvas, now); drawChart(canvas, canvas._pts, msgEl);
  return true;
}
// az ablak 30 mp-ről indul és az élő pontokkal együtt nő 3 percig, így az elejétől részletes
function trimLive(c, now){
  if (!c._window || !c._pts) return;
  const win = Math.min(c._window, Math.max(30, now - (c._liveStart || now) + 30)), lim = now - win;
  let k = 0; while (k < c._pts.length - 2 && c._pts[k][0] < lim) k++;
  if (k) c._pts.splice(0, k);
}
function stopLive(){ if (S.liveTimer){ clearInterval(S.liveTimer); S.liveTimer = null; } S.liveMint = null; }
function startTokenLive(mint){
  stopLive(); S.liveMint = mint;
  const tick = async () => {
    if (S.page !== "token" || S.liveMint !== mint){ stopLive(); return; }
    try { const r = await call("live", mint); if (S.liveMint !== mint) return; r.mint = mint; applyLive(r); } catch(e){}
  };
  let busy = false;
  const safeTick = async () => { if (busy) return; busy = true; try { await tick(); } finally { busy = false; } };
  S.liveTimer = setInterval(safeTick, 1000); safeTick();
}
function applyLive(r){
  S.lastLive = r;
  const cc = $("#tokChart");
  if (cc && cc._cs && cc._cs.mint === r.mint){ candleTick(cc._cs, r); renderCandles(cc); }
  if ($("#tPrice")){ $("#tPrice").textContent = fmtPrice(r.price); $("#tChg").innerHTML = pct(r.h24 || 0); }
  if ($("#tLive")) $("#tLive").innerHTML = `5m ${pct(r.m5 || 0)} · <b class="up">${r.buys5}</b> / <b class="down">${r.sells5}</b> ${esc(t("bs5m"))}`;
  const c = $("#tokChart");
  if (c && c._live && c._pts){ const ts = Math.floor(r.t), last = c._pts[c._pts.length-1];
    if (ts > last[0]){ c._pts.push([ts, r.price]);
      trimLive(c, ts);   // gördülő ablak
      if (c._pts.length > 900) c._pts.splice(0, c._pts.length - 900);
      animateLast(c, last); } }
}
// az utolsó szakasz sima kirajzolása (~0,8 mp); a pontok maguk valódi árak
function animateLast(c, prev){
  cancelAnimationFrame(c._raf); const msg = c.nextElementSibling, pts = c._pts, next = pts[pts.length-1], t0 = performance.now();
  if (!prev || prev[0] >= next[0]){ drawChart(c, pts, msg); return; }
  const frame = now => {
    if (c._pts !== pts || !c.isConnected) return;
    const k = Math.min(1, (now - t0) / 800), e = 1 - Math.pow(1 - k, 3);
    if (k < 1){ const tmp = pts.slice(0, -1); tmp.push([prev[0] + (next[0]-prev[0])*e, prev[1] + (next[1]-prev[1])*e]); drawChart(c, tmp, msg, true); c._raf = requestAnimationFrame(frame); }
    else drawChart(c, pts, msg);
  };
  c._raf = requestAnimationFrame(frame);
}

  el.innerHTML = `<div class="row head"><div>${t("h_asset")}</div><div class="r">${t("h_price")}</div><div class="r">${t("h_amount")}</div><div class="r">${t("h_value")}</div></div>` +
    rows.map(tk => `<div class="row" data-m="${esc(tk.address)}"><div class="tk">${avatar(tk)}<div style="min-width:0"><b>${esc(tk.name || tk.symbol)}</b><small>${esc(tk.symbol)}</small></div></div>
      <div class="r num">${fmtPrice(tk.price)}<div>${pct(tk.change24h||0)}</div></div><div class="r num">${fmtAmt(tk.amount)}<small class="muted" style="display:block">${esc(tk.symbol)}</small></div><div class="r num" style="font-weight:700">${fmtUsd(tk.value)}</div></div>`).join("") +
    (rows.length === 1 ? `<div class="empty">${own ? t("empty_own") : t("empty_other")}</div>` : "");
  el.querySelectorAll(".row[data-m]").forEach(r => r.onclick = () => openToken(r.dataset.m, own ? "home" : "wallet"));
}

let qTimer = null;
$("#q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(() => { const q = $("#q").value.trim(); q ? doSearch(q) : loadMarket(); }, 450); });
function skelRows(n){ return Array.from({length:n},()=>`<div class="row" style="cursor:default"><div class="tk"><div class="av skel"></div><div class="skel" style="width:120px;height:14px"></div></div><div class="skel" style="height:14px"></div><div class="skel" style="height:14px"></div><div class="skel" style="height:14px"></div></div>`).join(""); }
async function loadMarket(){ $("#mlist").innerHTML = skelRows(8);
  try { const r = await call("market", S.mkKind); renderMarket(r.items); } catch(e){ $("#mlist").innerHTML = `<div class="empty">${esc(e.message)}</div>`; } }
async function doSearch(q){ $("#mlist").innerHTML = skelRows(5);
  try { const r = await call("search", q); renderMarket(r.items); } catch(e){ $("#mlist").innerHTML = `<div class="empty">${esc(e.message)}</div>`; } }
function renderMarket(items){
  if (!items.length){ $("#mlist").innerHTML = `<div class="empty">${t("no_results")}</div>`; return; }
  const showAge = S.mkKind === "new" && !$("#q").value.trim();
  $("#mlist").innerHTML = `<div class="row head"><div>#</div><div>${t("h_coin")}</div><div class="r">${t("h_price")}</div><div class="r">${t("h_24h")}</div><div class="r">${showAge?t("h_age"):t("h_vol")}</div><div class="r">${t("h_mcap")}</div><div class="r">${t("h_liq")}</div></div>` +
    items.map((tk,i) => `<div class="row" data-m="${esc(tk.address)}"><div class="rank">${i+1}</div><div class="tk">${avatar(tk)}<div style="min-width:0"><b>${esc(tk.name || tk.symbol)}</b><small>${esc(tk.symbol)}</small></div></div>
     <div class="r num" style="font-weight:650">${fmtPrice(tk.price)}</div><div class="r">${pct(tk.change24h||0)}</div><div class="r num muted">${showAge ? age(tk.age_min) : fmtBig(tk.volume24)}</div><div class="r num muted">${fmtBig(tk.mcap)}</div><div class="r num muted">${fmtBig(tk.liquidity)}</div></div>`).join("");
  $$("#mlist .row[data-m]").forEach(r => r.onclick = () => openToken(r.dataset.m, "market"));
}

// =============== token oldal ===============
async function openToken(mint, back){
  S.back = back; S.tokTf = mint === SOL ? "24ó" : "live"; showPage("token");
  getChart(mint, mint === SOL ? "24ó" : "1ó").catch(() => {});   // a grafikon adatai már most elkezdenek töltődni
  $("#tokenBody").innerHTML = `<div class="th"><div class="av lg skel"></div><div><div class="skel" style="width:220px;height:26px"></div><div class="skel" style="width:140px;height:30px;margin-top:8px"></div></div></div><div class="card skel" style="height:380px"></div>`;
  let tk; try { tk = await call("token", mint); } catch(e){ $("#tokenBody").innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
  S.token = tk;
  const isSol = tk.address === SOL;
  const links = [...(tk.websites||[]).slice(0,1).map(u=>[t("website"),u]), ...(tk.socials||[]).map(s=>[s.type==="twitter"?"X":s.type==="telegram"?"Telegram":s.type,s.url])].slice(0,3);
  const reasons = tk.rug.reasons.length ? tk.rug.reasons : [{level:"ok",text:t("no_rug")}];
  $("#tokenBody").innerHTML = `
   <div class="th">${avatar(tk,"lg")}<div><h1>${esc(tk.name || tk.symbol)} <span class="sym">${esc(tk.symbol)}</span></h1>
     <div class="price num"><span id="tPrice">${fmtPrice(tk.price)}</span> <span id="tChg">${pct(tk.change24h||0)}</span></div></div>
     <div class="links">${links.map(([n,u])=>`<button class="btn sm" data-url="${esc(u)}">${esc(n)} ↗</button>`).join("")}</div></div>
   <div class="chips"><span class="chip">${t("mcap")} <b class="num">${fmtBig(tk.mcap)}</b></span><span class="chip">${t("liq")} <b class="num">${fmtBig(tk.liquidity)}</b></span>
     <span class="chip">${t("vol24")} <b class="num">${fmtBig(tk.volume24)}</b></span><span class="chip">${t("age")} <b>${age(tk.age_min)}</b></span>
     <span class="chip mono" style="cursor:pointer" id="caChip">${esc(short(tk.address))} ⧉</span>${isSol ? "" : `<span class="chip" id="tLive"></span>`}</div>
   <div class="tgrid">
     <div>
       <div class="card chart-card"><div class="chart-head"><div class="cap">${t("price_chart")}</div><div class="tabs" id="tokTf"></div></div>
         <div class="chart-wrap"><canvas id="tokChart"></canvas><div class="chart-msg" id="tokChartMsg"></div></div></div>
       ${isSol ? "" : `<div class="card rug"><div class="rug-h"><div class="cap">${t("safety")}</div><span class="badge lv${tk.rug.level}">${t("rug"+tk.rug.level)}</span></div>
         <ul>${reasons.map(r=>`<li><i style="background:${r.level==="danger"?"var(--down)":r.level==="warn"?"var(--warn)":"var(--up)"}"></i>${esc(r.text)}</li>`).join("")}</ul></div>`}
     </div>
     <div class="card trade" id="trade"></div>
   </div>`;
  $$("#tokenBody [data-url]").forEach(b => b.onclick = () => api.open_url(b.dataset.url));
  $("#caChip").onclick = () => copyText(tk.address, t("ca_copied"));
  tfTabs($("#tokTf"), S.tokTf, tf => { S.tokTf = tf; loadChart(tk.address, tf, $("#tokChart"), $("#tokChartMsg")); }, isSol ? undefined : ["live","1ó","24ó","7n","30n"]);
  loadChart(tk.address, S.tokTf, $("#tokChart"), $("#tokChartMsg"));
  renderTrade(tk, "buy");
  if (!isSol) startTokenLive(tk.address);
}
function renderTrade(tk, side){
  const el = $("#trade"), isSol = tk.address === SOL;
  if (isSol){ el.innerHTML = `<div class="cap">SOL</div><p class="muted" style="margin:10px 0 16px;font-size:13.5px">${t("sol_card")}</p>
     <div class="kv"><span>${t("you_have")}</span><b class="num">${fmtAmt(tk.held)} SOL</b></div><button class="btn buy lg" style="width:100%;margin-top:14px" data-a="buysol">${t("buy_sol_card")}</button>
     <button class="btn lg" style="width:100%;margin-top:8px" data-a="send">${t("send_sol")}</button>`; return; }
  const solBal = S.port ? S.port.sol : 0, def = S.prof.default_buy || "0.1";
  el.innerHTML = `<div class="tabs"><button class="b ${side==="buy"?"on":""}" data-s="buy">${t("buy")}</button><button class="s ${side==="sell"?"on":""}" data-s="sell">${t("sell")}</button></div>` +
   (side === "buy" ? `
     <div class="cap">${t("amount")}</div><div class="field" style="margin-top:6px"><input id="buyAmt" class="num" value="${esc(def)}" inputmode="decimal"><span class="unit">SOL</span></div>
     <div class="presets">${["0.05","0.1","0.25","0.5"].map(v=>`<button data-v="${v}">${v}</button>`).join("")}</div>
     <div class="kv"><span>${t("available")}</span><b class="num">${fmtAmt(solBal)} SOL</b></div>
     <div class="kv"><span>${t("est_value")}</span><b class="num" id="buyUsd">–</b></div>
     <div class="err" id="tErr" style="margin-top:8px"></div>
     <button class="btn buy lg" style="width:100%;margin-top:6px" id="tGo">${esc(t("buy_x",{s:tk.symbol}))}</button>` : `
     <div class="kv"><span>${t("you_have")}</span><b class="num">${fmtAmt(tk.held)} ${esc(tk.symbol)}</b></div>
     <div class="kv"><span>${t("worth")}</span><b class="num">${fmtUsd(tk.held * tk.price)}</b></div>
     <div class="cap" style="margin-top:14px">${t("how_much_sell")}</div>
     <div class="presets">${[25,50,100].map(v=>`<button data-p2="${v}" class="${S.prof.instant_sell ? "instant" : ""}">${S.prof.instant_sell ? "⚡ " : ""}${v}%</button>`).join("")}</div>
     ${S.prof.instant_sell ? `<div class="faint" style="font-size:12px">${t("instant_on_note", {m: S.prof.max_impact ?? 10})}</div>` : ""}
     <div class="err" id="tErr"></div>`);
  el.querySelectorAll("[data-s]").forEach(b => b.onclick = () => renderTrade(tk, b.dataset.s));
  if (side === "buy"){
    const upd = () => { const v = parseFloat(($("#buyAmt").value||"").replace(",",".")); $("#buyUsd").textContent = v>0 && S.port ? fmtUsd(v*S.port.sol_price) : "–"; };
    $("#buyAmt").addEventListener("input", upd); upd();
    el.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { $("#buyAmt").value = b.dataset.v; upd(); });
    const go = async () => { const b = $("#tGo"); $("#tErr").textContent = ""; busyBtn(b,true);
      try { const q = await call("quote_buy", tk.address, $("#buyAmt").value); busyBtn(b,false); modalConfirm(q, "buy", tk); }
      catch(err){ busyBtn(b,false); $("#tErr").textContent = err.message; if (/API (kulcs|key)/.test(err.message)) modalApiKey(); } };
    $("#tGo").onclick = go; onEnter($("#buyAmt"), go);
  } else {
    el.querySelectorAll("[data-p2]").forEach(b => b.onclick = async () => { $("#tErr").textContent = ""; if (!(tk.held > 0)) { $("#tErr").textContent = t("no_token"); return; }
      const pc = +b.dataset.p2; busyBtn(b,true);
      if (S.prof.instant_sell){   // ⚡ azonnali eladás: ajánlat + aláírás + küldés egy lépésben
        try { const r = await call("instant_sell", tk.address, pc); busyBtn(b,false);
          const link = r.signature ? "https://solscan.io/tx/" + r.signature : null;
          if (r.success) toast(t("sold_inst", {p: pc, s: tk.symbol, v: (+r.sol).toPrecision(4)}), "ok", link, 9000); else toast(r.message, "bad", link, 12000);
          setTimeout(async () => { await refreshPortfolio(); if (S.page==="token" && S.token && S.token.address===tk.address){ const nt = await call("token", tk.address).catch(()=>null); if (nt){ S.token = nt; renderTrade(nt, "sell"); } } }, 1500);
        } catch(err){ busyBtn(b,false); $("#tErr").textContent = err.message; }
        return; }
      try { const q = await call("quote_sell", tk.address, pc); busyBtn(b,false); modalConfirm(q, "sell", tk); }
      catch(err){ busyBtn(b,false); $("#tErr").textContent = err.message; } });
  }
}

function modal(html){ $("#modal").innerHTML = html; $("#ov").classList.add("on"); }
function closeModal(){ $("#ov").classList.remove("on"); clearInterval(S.timer); }
$("#ov").addEventListener("click", e => { if (e.target.id === "ov" && !S.modalLocked) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !S.modalLocked) closeModal(); });

function modalConfirm(q, side, tk){
  const buy = side === "buy", high = buy && q.rug_level === 2;
  modal(`<h2>${buy ? t("confirm_buy") : t("confirm_sell")}</h2><div class="sub">${esc(tk.name || tk.symbol)}</div>
   <div class="box">
     <div class="kv"><span>${t("you_pay")}</span><b class="num">${esc(q.pay)}${q.pay_usd ? ` <span class="muted">≈ ${fmtUsd(q.pay_usd)}</span>` : ""}</b></div>
     <div class="kv"><span>${t("you_get")}</span><b class="num up">${esc(q.get)}</b></div>
     <div class="kv"><span>${t("impact")}</span><b class="num ${q.impact>5?"down":""}">${q.impact.toFixed(2)}%</b></div>
     <div class="kv"><span>${t("slippage")}</span><b class="num">${q.slippage.toFixed(2)}%</b></div>
     <div class="kv"><span>${t("fees")}</span><b class="num">≈ ${q.fees_sol.toFixed(5)} SOL${q.gasless?t("sponsored"):""}</b></div>
   </div>
   ${q.impact > 5 ? `<div class="warnbox" style="margin-top:12px">${t("impact_warn")}</div>` : ""}
   ${high ? `<div class="warnbox" style="margin-top:12px">${t("rug_type")}<div class="field" style="margin-top:8px;background:var(--bg2)"><input id="igen" autocomplete="off"></div></div>` : ""}
   <div class="faint" style="font-size:12px;margin-top:12px" id="qTimer"></div><div class="err" id="cErr"></div>
   <div class="mrow"><button class="btn" id="cNo">${t("cancel")}</button><button class="btn ${buy?"buy":"sell"} lg" id="cYes">${buy?t("buy"):t("sell")}</button></div>`);
  const t0 = Date.now(); $("#cNo").onclick = closeModal;
  const tick = () => { const left = q.valid_s - (Date.now()-t0)/1000; const ok = left > 0 && (!high || ($("#igen").value.trim().toUpperCase()===t("confirm_word")));
    $("#cYes").disabled = !ok; $("#qTimer").textContent = left > 0 ? t("quote_left", {n: Math.ceil(left)}) : t("quote_expired"); };
  tick(); S.timer = setInterval(tick, 400); if (high) $("#igen").addEventListener("input", tick);
  $("#cYes").onclick = async () => { const b = $("#cYes"); busyBtn(b,true); clearInterval(S.timer);
    try { const r = await call("execute", q.order_id, high ? $("#igen").value : "");
      closeModal(); const link = r.signature ? "https://solscan.io/tx/" + r.signature : null;
      if (r.success) toast(t(buy ? "bought" : "sold", {s: tk.symbol}), "ok", link, 9000); else toast(r.message, "bad", link, 12000);
      setTimeout(async () => { await refreshPortfolio(); if (S.page==="token" && S.token) { const nt = await call("token", tk.address).catch(()=>null); if (nt){ S.token = nt; renderTrade(nt, side); } } }, 2500);
    } catch(err){ busyBtn(b,false); $("#cErr").textContent = err.message; } };
}

function modalAccount(mode, first, thenKey){
  S.modalLocked = false;
  const reg = mode !== "login", after = () => { if (thenKey) setTimeout(modalApiKey, 400); };
  if (S.acct && !S.acct.configured){
    modal(`<h2>${t("acc_reg_t")}</h2><div class="warnbox" style="background:var(--accSoft);color:var(--text)">${t("acc_not_conf")}</div>
      <div class="mrow"><button class="btn" id="acNo">${t("close")}</button><button class="btn pri" id="acSet">${t("nav_settings")}</button></div>`);
    $("#acNo").onclick = () => { closeModal(); after(); };
    $("#acSet").onclick = () => { closeModal(); showPage("settings"); setTimeout(() => $("#sAcc") && $("#sAcc").scrollIntoView({block:"start"}), 400); };
    return;
  }
  modal(`<h2>${t(reg ? "acc_reg_t" : "acc_login_t")}</h2><div class="sub">${t(reg ? "acc_reg_p" : "acc_login_p")}</div>

let gTimer = null, gSel = -1, gItems = [];
function gClose(){ $("#gres").classList.remove("on"); gSel = -1; }
function gRender(r, q){
  gItems = []; let html = "";
  const add = (fn, inner) => { gItems.push(fn); return `<div class="it" data-i="${gItems.length-1}">${inner}</div>`; };
  if (r.friends && r.friends.length) html += `<h6>${t("friends_h")}</h6>` + r.friends.map(f => add(() => openWallet(f.address, S.page),
      `${personAv(f.name, f.address, "sm")}<div class="tk"><div><b>@${esc(f.name)}</b><small class="mono">${esc(short(f.address))}</small></div></div>`)).join("");
  if (r.coins && r.coins.length) html += `<h6>${t("coins_h")}</h6>` + r.coins.map(tk => add(() => openToken(tk.address, S.page === "token" ? (S.back || "market") : S.page),
      `${avatar(tk, "sm")}<div class="tk" style="min-width:0"><div style="min-width:0"><b>${esc(tk.name || tk.symbol)}</b><small>${esc(tk.symbol)}</small></div></div><div class="rt num"><div style="font-weight:650">${fmtPrice(tk.price)}</div>${pct(tk.change24h||0)}</div>`)).join("");
  if (r.wallets && r.wallets.length) html += `<h6>${t("wallet_h")}</h6>` + r.wallets.map(w => add(() => { S.wname = w.name; openWallet(w.address, S.page); },
      `${personAv(w.name || "?", w.address, "sm")}<div class="tk"><div><b>${esc(w.name || t("view_wallet"))}</b><small class="mono">${esc(short(w.address))}</small></div></div><div class="rt muted" style="font-size:12.5px">${t("view_arrow")}</div>`)).join("");
  if (!html) html = `<div class="note">${esc(r.note || (q.startsWith("@") ? t("no_friend_named") : t("no_results")))}</div>`;
  $("#gres").innerHTML = html; $("#gres").classList.add("on"); gSel = -1;
  $$("#gres .it").forEach(el => el.onclick = () => { const fn = gItems[+el.dataset.i]; gClose(); $("#gq").value = ""; $("#gq").blur(); fn(); });
}
$("#gq").addEventListener("input", () => { clearTimeout(gTimer); const q = $("#gq").value.trim();
  if (!q){ gClose(); return; }
  $("#gres").innerHTML = `<div class="note">${t("searching")}</div>`; $("#gres").classList.add("on");
  gTimer = setTimeout(async () => { try { const r = await call("search_all", q); if ($("#gq").value.trim() === q) gRender(r, q); } catch(e){ $("#gres").innerHTML = `<div class="note">${esc(e.message)}</div>`; } }, 380); });
$("#gq").addEventListener("keydown", e => {
  const its = $$("#gres .it");
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){ if (!its.length) return; e.preventDefault(); gSel = (gSel + (e.key === "ArrowDown" ? 1 : -1) + its.length) % its.length; its.forEach((x,i) => x.classList.toggle("sel", i === gSel)); }
  else if (e.key === "Enter"){ const el = its[gSel >= 0 ? gSel : 0]; if (el) el.click(); }
  else if (e.key === "Escape"){ gClose(); $("#gq").blur(); }
});
$("#gq").addEventListener("focus", () => { if ($("#gq").value.trim() && $("#gres").innerHTML) $("#gres").classList.add("on"); });
document.addEventListener("mousedown", e => { if (!e.target.closest(".gsearch")) gClose(); });

async function loadSwaps(){
  let list; try { list = await call("xswap_list"); } catch(e){ return; }
  const prev = S.swapSt || {}; S.swapSt = {};
  list.forEach(x => { S.swapSt[x.deposit] = x.status;
    if (prev[x.deposit] && prev[x.deposit] !== "SUCCESS" && x.status === "SUCCESS"){ toast(t("xs_done", {v: (x.got || x.get) + " " + x.sym_out}), "ok", x.out_link || x.link, 10000); refreshPortfolio(); loadBtcInfo(false); } });
  S.swapsActive = list.some(x => !["SUCCESS","REFUNDED","FAILED"].includes(x.status));
  if (!$("#xsCard")) return;
  $("#xsCard").style.display = list.length ? "" : "none";
  const loc = LANG === "hu" ? "hu-HU" : "en-US";
  $("#xsList").innerHTML = list.map((x, i) => { const ok = x.status === "SUCCESS", bad = ["REFUNDED","FAILED","INCOMPLETE_DEPOSIT"].includes(x.status);
    return `<div class="row" data-xs="${i}" style="grid-template-columns:minmax(200px,1.6fr) 1fr 1fr">
      <div class="tk"><div class="av sm" style="background:var(--accSoft);color:var(--acc)">⇄</div><div><b class="num">${esc(x.pay)} ${esc(x.sym_in)} → ${ok && x.got ? "" : "≈ "}${esc(x.got || x.get || "?")} ${esc(x.sym_out)}</b>
        <small>${esc(new Date(x.time*1000).toLocaleString(loc,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}))}${x.refund_reason ? " · " + esc(x.refund_reason) : ""}</small></div></div>
      <div><span class="pill ${ok ? "up" : bad ? "down" : "flat"}">${!ok && !bad ? '<span class="spin" style="width:10px;height:10px;border-width:2px"></span> ' : ""}${esc(t("xs_" + x.status) || x.status)}</span></div>
      <div class="muted" style="font-size:12.5px">${!ok && !bad && x.eta ? esc(t("xs_minutes", {n: Math.max(1, Math.round(x.eta/60))})) : ""}</div></div>`; }).join("");
  $$("#xsList [data-xs]").forEach(r => r.onclick = () => { const x = list[+r.dataset.xs]; api.open_url(x.out_link || x.link); });
}

// profilkép: kicsinyítés 192x192-re, JPEG
$("#avFile").addEventListener("change", e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { const img = new Image();
    img.onload = async () => { const c = document.createElement("canvas"); c.width = c.height = 192; const g = c.getContext("2d");
      const s = Math.min(img.width, img.height); g.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, 192, 192);
      const url = c.toDataURL("image/jpeg", 0.85);
      try { await call("profile_update", {avatar: url}); S.prof.avatar = url; updateMe(); renderSettings(); toast(t("saved"), "ok"); } catch(err){ toast(err.message, "bad"); } };
    img.onerror = () => toast(t("avatar_big"), "bad"); img.src = rd.result; };
  rd.readAsDataURL(f);
});

// =============== Android: vissza gomb ===============
(() => {
  const App = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if (!App) return;
  App.addListener("backButton", () => {
    if ($("#ov").classList.contains("on")) { if (!S.modalLocked) closeModal(); return; }
    if ($("#gres").classList.contains("on")) { gClose(); return; }
    if ($("#gate").classList.contains("on")) { App.exitApp(); return; }
    if (S.page === "token") { $("#backBtn").click(); return; }
    if (S.page === "wallet") { $("#wBack").click(); return; }
    if (S.page !== "home") { showPage("home"); return; }
    App.exitApp();
  });
})();

// =============== indulás ===============
async function boot(){
  api = window.pywebview.api;
  const st = await call("state");
  LANG = st.lang || "en"; applyAccent(st.accent); applyI18n();
  if (!st.has_wallet) gateWelcome(); else if (!st.unlocked) gateUnlock(st.pubkey); else enterApp();
  setInterval(() => { if (S.pub && !S.locked && S.port && document.visibilityState === "visible") refreshPortfolio(); }, 30000);
}
if (window.pywebview && window.pywebview.api) boot(); else window.addEventListener("pywebviewready", boot);
